knowledge_id: KNW-PROD-LOGI-TAP
name: "Logitech Tap & Tap IP"
vendor: "Logitech"
knowledge_type: product
status: VERIFIED
last_verified: "2026-09-23"

overview:
  tier: "smart_room_touch_controller"
  form_factor: "10.1인치 전용 화상회의 터치스크린 패널 (원터치 회의 참가 OBTJ)"
  target_room_size: "소형, 중형, 대형 모든 회의실 (Zoom Rooms, Teams Rooms, Google Meet)"

scope:
  applies_to:
    - LOGI-TAP
    - LOGI-TAP-IP
  does_not_imply:
    - Tap IP 모델에 물리 HDMI In 단자가 탑재됨 (Tap IP는 순수 PoE 네트워크 제어 방식)
    - 자체적으로 화상회의 컴퓨팅 엔진(RoomMate 등) 없이 단독으로 구동됨

