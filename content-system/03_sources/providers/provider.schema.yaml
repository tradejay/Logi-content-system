$schema: "http://json-schema.org/draft-07/schema#"
title: "SourceProviderSchema"
description: "Schema for external or local documentation source provider definitions"
type: object
required:
  - provider_id
  - name
  - authority
  - access_type
  - supported_document_types
  - capabilities
  - freshness_policy
  - adapter

properties:
  provider_id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "Unique slug identifier for the provider (e.g. logitech-local, zoom-api)"

  name:
    type: string
    description: "Human readable name of the provider"

  authority:
    type: string
    enum:
      - OFFICIAL_VENDOR
      - PLATFORM_OFFICIAL
      - CERTIFIED_COMMUNITY
      - INTERNAL_FIELD_TEST

  access_type:
    type: string
    enum:
      - local_cli
      - local_fs
      - api
      - web_crawl

  supported_document_types:
    type: array
    items:
      type: string
      enum:
        - GUIDE
        - SPEC
        - WHITE_PAPER
        - RELEASE_NOTE
        - SUPPORT
        - TROUBLESHOOTING
        - API_DOC

  capabilities:
    type: object
    required:
      - search
      - fetch_document
      - fetch_section
      - version_lookup
    properties:
      search:
        type: boolean
      fetch_document:
        type: boolean
      fetch_section:
        type: boolean
      version_lookup:
        type: boolean

  freshness_policy:
    type: object
    required:
      - short_ttl_days
      - medium_ttl_days
      - long_ttl_days
    properties:
      short_ttl_days:
        type: integer
        minimum: 1
      medium_ttl_days:
        type: integer
        minimum: 1
      long_ttl_days:
        type: integer
        minimum: 1

  adapter:
    type: object
    required:
      - type
      - entrypoint
    properties:
      type:
        type: string
        enum:
          - cli
          - script
          - http_rest
          - static_fs
      entrypoint:
        type: string
        description: "Python module or command string"
      config:
        type: object
        additionalProperties: true
