$schema: "http://json-schema.org/draft-07/schema#"
title: "FactSchema"
description: "Canonical normalized schema for atomic technical facts extracted from official documentation"
type: object
required:
  - fact_id
  - subject
  - canonical_property
  - value
  - scope
  - source
  - verified_at
  - status

properties:
  fact_id:
    type: string
    pattern: "^FACT-[A-Z0-9-]+$"
    description: "Unique identifier for the atomic fact (e.g. FACT-RB-001)"

  subject:
    type: string
    description: "Hardware product or technology subject (e.g. Logitech Rally Bar, RightSight 2)"

  canonical_property:
    type: string
    description: "Canonical property identifier defined in property_ontology.yaml"

  value:
    type: [string, number, boolean]
    description: "Normalized exact value (e.g. 4.5, 7, true, 90)"

  unit:
    type: string
    description: "Physical unit of measurement (e.g. m, mm, W, dB, deg, x)"

  qualifier:
    type: string
    enum:
      - EXACT
      - MAXIMUM
      - RECOMMENDED
      - MINIMUM
      - NOMINAL
      - UP_TO
    description: "Operational quantifier"

  scope:
    type: object
    required:
      - applies_to
    properties:
      applies_to:
        type: array
        items:
          type: string
        description: "List of Product IDs or Platform IDs this fact validly applies to"
      prohibited_products:
        type: array
        items:
          type: string
        description: "Products where this fact is explicitly invalid or not supported"
      platforms:
        type: array
        items:
          type: string
      versions:
        type: string

  source:
    type: object
    required:
      - source_id
    properties:
      provider_id:
        type: string
      source_id:
        type: string
      document_id:
        type: string
      locator:
        type: object
        properties:
          section:
            type: string
          heading:
            type: string
          url:
            type: string
          captured_at:
            type: string

  verified_at:
    type: string
    format: date
    description: "Date when fact was verified against primary documentation"

  status:
    type: string
    enum:
      - VERIFIED
      - PROVISIONAL
      - DEPRECATED
