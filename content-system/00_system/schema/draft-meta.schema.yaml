$schema: "http://json-schema.org/draft-07/schema#"
title: "DraftMetaSchema"
description: "Writer AI가 초안(Draft) 상단 Frontmatter에 기록하는 메타데이터 스키마"
type: object
required:
  - content_id
  - title
  - author_role
  - version
  - status
  - target_keyword
  - sources_used
  - missing_evidence_count
  - created_at

properties:
  content_id:
    type: string
    pattern: "^CNT-\\d{4}W\\d{2}-\\d{3}$"

  title:
    type: string

  author_role:
    type: string
    enum: [WRITER]

  version:
    type: string
    pattern: "^\\d+\\.\\d+$"

  status:
    type: string
    enum: [WRITING, READY_FOR_QA, NEEDS_EVIDENCE]

  target_keyword:
    type: string

  estimated_reading_time_minutes:
    type: integer

  sources_used:
    type: array
    items:
      type: string
      pattern: "^SRC-"

  missing_evidence_count:
    type: integer
    minimum: 0

  created_at:
    type: string
    format: date
