    output: "최대 90dB SPL @ 1W, 99dB SPL @ 8.0W (1/2m 기준)"
    technology: "특허받은 안티 바이브레이션(Anti-vibration) 서스펜션 인클로저 탑재"
    benefit: "저음 스피커 진동이 카메라 렌즈 및 마이크로 전달되지 않아 줌 상태에서도 화면 떨림 방지"

