derived_knowledge:
  - id: DKNW-RB-001
    statement: "Rally Bar의 마이크 수음 반경(7m)은 본체 단독 사용 시 최대 8~10인 규모 룸에 적합하다."
    derived_from:
      - FACT-RB-001
    derivation_type: room_suitability_inference
    rationale: "룸 길이 8m 이상 또는 15인 이상 룸에서는 테이블 중앙까지의 음향 감쇄를 보완하기 위해 추가 마이크 팟이 필요함."

optics_and_camera:
  main_camera:
    resolution: "최대 4K Ultra HD @ 30fps"
    zoom: "최대 15배 HD 줌 (광학 5배 + 무손실 디지털 3배)"
    pan_tilt: "전동 팬 ±25°, 전동 틸트 ±15°"
