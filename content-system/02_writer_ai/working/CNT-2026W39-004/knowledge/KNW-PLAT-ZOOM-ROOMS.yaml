knowledge_id: KNW-PLAT-ZOOM-ROOMS
name: "Zoom Rooms Intelligent Camera Integration"
vendor: "Zoom"
knowledge_type: platform
status: VERIFIED
last_verified: "2026-09-23"

overview:
  platform: "Zoom Rooms"
  client_types:
    - "Zoom Rooms Appliance (CollabOS)"
    - "Zoom Rooms for Windows"
    - "Zoom Rooms for macOS"

camera_control_modes:
  manual:
    description: "사용자가 컨트롤러(Tap)에서 PTZ 화각을 수동으로 프리셋 지정 및 조작"
  auto_framing:
    description: "회의실 내 인원을 감지하여 전원이 잘리지 않게 프레이밍 (디바이스 Group View와 연동)"
  speaker_focus:
    description: "발화자를 감지하여 해당 인물 중심의 단독 클로즈업 뷰로 자동 전환 (디바이스 Speaker View와 연동)"
  multi_stream:
    description: "Smart Gallery 모드로 참석자별 개별 스트림을 클라우드로 전송 (Zoom Rooms 전용 라이선스 필요)"

admin_settings_procedure:
  web_portal:
    step_1: "zoom.us 포털에 관리자 계정으로 로그인"
    step_2: "Room Management ➔ Zoom Rooms 메뉴 진입"
    step_3: "설정할 대상 룸 선택 후 'Devices' 탭 클릭"
    step_4: "Camera Control 옵션을 켜고 기본 모드를 'Speaker Focus' 또는 'Auto-Framing'으로 지정"
  in_room_controller:
    step_1: "테이블 위 Logitech Tap 화면의 좌측 '카메라 제어' 아이콘 터치"
    step_2: "RightSight 2 모드(그룹 뷰 / 화자 뷰) 즉각 토글 변경 가능"

prerequisites:
  - "Zoom Rooms 5.9 이상 권장"
  - "CollabOS 1.5 이상 펌웨어 업데이트 권장"

