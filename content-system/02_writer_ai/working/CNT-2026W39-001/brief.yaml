product_bridge:
  product: Logitech Rally Bar
  reason: 전동 PTZ 광학 렌즈와 상시 감시용 AI 뷰파인더 듀얼 카메라 및 6개 빔포밍 마이크로 화자 추적을 일체형으로 구현한 대표 장비
  limitations: 단독 수음 반경은 7m(8~10인 룸)에 최적화되어 있으며, 15인 이상 대형 룸에서는 테이블 중앙에 확장 Rally Mic Pod 추가 배치가 필수적임
