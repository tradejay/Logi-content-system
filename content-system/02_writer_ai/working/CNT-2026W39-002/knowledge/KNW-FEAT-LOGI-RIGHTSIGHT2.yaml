derived_knowledge:
  - id: DKNW-RS2-001
    type: DERIVED_RELATION
    subject: RightSight2.SpeakerView.max_distance
    relation: compares_with
    object: RightSight2.GroupView.max_distance
    operator: "<"
    statement: "Speaker View의 권장 최대 거리는 Group View보다 짧다."
    derived_from:
      - FACT-RS2-001
      - FACT-RS2-003
    derivation_type: numerical_comparison
    confidence: VERIFIED
    rationale: "화자 뷰 권장 거리(4.5m)는 그룹 뷰(7.0m)보다 물리적 유효 반경이 보수적으로 설정됨."

  - id: DKNW-RS2-002
    type: DERIVED_RELATION
    subject: speaker_tracking_recommended_distance
    relation: disjoint_with
    object: microphone_pickup_range
    statement: "화자추적 권장 거리와 마이크 픽업 거리는 일치하지 않는다."
