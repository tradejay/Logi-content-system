knowledge_id: KNW-FEAT-LOGI-RIGHTSIGHT2
name: "Logitech RightSight 2"
vendor: "Logitech"
knowledge_type: feature
status: VERIFIED
last_verified: "2026-09-23"

definition:
  summary: >
    로지텍 회의실 비디오 바 및 카메라 제품군에서 제공되는 2세대 온디바이스 AI
    자동 프레이밍 및 지능형 화자 추적 영상 구성 기술군.
  scope:
    applies_to:
      - LOGI-RALLY-BAR
      - LOGI-RALLY-BAR-MINI
      - LOGI-MEETUP-2
    does_not_imply:
      - 모든 RightSight 2 제품이 동일한 듀얼 렌즈(AI Viewfinder) 구조를 사용함 (MeetUp 2는 단일 렌즈 NPU 크롭)
      - 화자 추적 권장 거리가 마이크 수음 반경과 동일함 (화자 추적 권장 거리는 4.5m, 마이크 픽업 거리는 7m)
      - Teams Rooms 클라우드 IntelliFrame과 온디바이스 RightSight 2가 동일한 기능임
      - RightSight 2 화자추적 기능을 사용하려면 Zoom Rooms 또는 Teams Rooms 유료 라이선스가 필수적임 (BYOD USB 모드 및 로컬 어플라이언스에서 독립 동작)
      - Rally Mic Pod 증설이 RightSight 2 카메라 화자 추적(트래킹) 위치 정보를 제공하거나 추적 거리를 연장함 (Mic Pod는 단순 오디오 수음 장치이며, 카메라 추적 공간 좌표를 일체 제공하지 않음)

